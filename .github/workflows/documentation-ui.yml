name: Documentation folders UI
on:
  push:
    branches: [main, codex/documentation-manual-folders]
    paths: ['web/**', 'backend/**', '.github/workflows/documentation-ui.yml']
  pull_request:
    paths: ['web/**', 'backend/**', '.github/workflows/documentation-ui.yml']
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: 'True'
      DJANGO_SQLITE_PATH: /tmp/documentation-ui.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated server and UI
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci --prefix web --no-audit --no-fund
          npm run build --prefix web -- --base=/static/web/
          cp -a web/dist/assets backend/static/web/
          cp web/dist/index.html backend/templates/index.html
          python backend/manage.py migrate --noinput
          python backend/manage.py shell -c "exec(open('web/tool/seed-documentation.py').read())"
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/documentation-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/documentation-server.log
          exit 1
      - name: Check folder operations, tags and 320–2560 px layouts
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          node web/tool/check-documentation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-ui-results
          path: |
            /tmp/lift-documentation-*.png
            /tmp/documentation-server.log
          if-no-files-found: ignore
