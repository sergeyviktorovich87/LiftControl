name: Compact parts list and header UI
on:
  push:
    branches: [main, codex/compact-parts]
    paths: ['web/**', '.github/workflows/parts-ui.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/parts-ui.yml']
permissions:
  contents: read
jobs:
  parts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Start local parts UI
        run: |
          npm --prefix web run dev -- --host 127.0.0.1 --port 5173 > /tmp/parts-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/parts-vite.log
          exit 1
      - name: Check compact parts, filters, history, forms and header
        run: |
          export PARTS_CHROME_EXECUTABLE="$(command -v google-chrome || command -v chromium)"
          node web/tool/check-parts.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parts-ui-diagnostics
          path: |
            /tmp/liftcontrol-parts-*.png
            /tmp/parts-vite.log
          if-no-files-found: ignore
