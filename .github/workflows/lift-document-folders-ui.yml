name: Legal document folders UI
on:
  push:
    branches: [main, codex/lift-document-folders]
    paths: ['web/**', '.github/workflows/lift-document-folders-ui.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/lift-document-folders-ui.yml']
permissions:
  contents: read
jobs:
  folders:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Start local folder UI
        run: |
          npm --prefix web run dev -- --host 127.0.0.1 --port 5173 > /tmp/lift-folders-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lift-folders-vite.log
          exit 1
      - name: Check folder linking, inheritance, lift card and responsive editor
        run: |
          export LIFT_FOLDERS_CHROME="$(command -v google-chrome || command -v chromium)"
          node web/tool/check-lift-folders.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lift-folders-ui-diagnostics
          path: |
            /tmp/lift-legal-folders-*.png
            /tmp/lift-folders-vite.log
          if-no-files-found: ignore
