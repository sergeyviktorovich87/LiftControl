name: Verify compact offline update
on:
  push:
    paths: ['deploy/offline/**', 'backend/core/maintenance_pdf.py', '.github/workflows/offline-patch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact source update and check its manifest
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build -- --base=/static/web/
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python -m pip download --no-deps --only-binary=:all: --dest /tmp/lc-wheels reportlab==4.4.9
          python deploy/offline/package.py --wheel-dir /tmp/lc-wheels --commit "$GITHUB_SHA" --output /tmp/LiftControl-v0.13.5-update.zip
          unzip -q /tmp/LiftControl-v0.13.5-update.zip -d /tmp/patch
          cd /tmp/patch/LiftControl-v0.13.5-update
          sha256sum --check --strict PATCH.sha256
          bash -n update-panel.sh
      - name: Build the actual 0.8 baseline
        run: |
          mkdir /tmp/baseline
          git archive 90d7b0147ad51feb7f93cc39861de194574831cc backend | tar -x -C /tmp/baseline
          docker build -t liftcontrol-api:baseline08 /tmp/baseline/backend
      - name: Apply the patch with networking disabled
        run: |
          docker build --pull=false --network none --build-arg BASE_IMAGE=liftcontrol-api:baseline08 --build-arg BUILD_COMMIT="$GITHUB_SHA" -t liftcontrol-api:patched09 /tmp/patch/LiftControl-v0.13.5-update
          test "$(docker inspect liftcontrol-api:patched09 --format '{{.Config.User}}')" = '10001:10001'
      - name: Verify migration preserves installed business data
        run: |
          mkdir /tmp/patch-database
          chmod 777 /tmp/patch-database
          docker run --rm -v /tmp/patch-database:/check -e DJANGO_DEBUG=True -e DB_ENGINE=sqlite -e DJANGO_SQLITE_PATH=/check/db.sqlite3 --entrypoint sh liftcontrol-api:baseline08 -ec "python manage.py migrate --noinput; python manage.py shell -c \"from core.models import Building,Elevator,Ticket,Document; b=Building.objects.create(name='Keep building',address='Keep address'); e=Elevator.objects.create(building=b,inventory_number='KEEP-001'); Ticket.objects.create(elevator=e,title='Keep ticket',description='Keep report'); Document.objects.create(organization_id=1,title='Keep document',manufacturer='MEL',file='private/keep.pdf')\""
          docker run --rm -v /tmp/patch-database:/check -e DJANGO_DEBUG=True -e DB_ENGINE=sqlite -e DJANGO_SQLITE_PATH=/check/db.sqlite3 --entrypoint sh liftcontrol-api:patched09 -ec "python manage.py migrate --noinput; python manage.py shell -c \"from core.models import Ticket,Elevator,Document,MobileSyncReceipt; assert Ticket.objects.get().description=='Keep report'; assert Elevator.objects.get().inventory_number=='KEEP-001'; assert Document.objects.get().deleted_at is None; assert not MobileSyncReceipt.objects.exists(); from django.test import Client; d=Client(HTTP_HOST='localhost').get('/api/health/').json(); assert d['version']=='0.13.5' and d['offline_sync_api']==1; print('INSTALLED DATA AND API VERIFIED')\""
      - name: Run all server checks in the patched image
        run: docker run --rm --tmpfs /tmp:rw,mode=1777 -e DJANGO_DEBUG=True -e DB_ENGINE=sqlite -e DJANGO_SQLITE_PATH=/tmp/check.sqlite3 --entrypoint python liftcontrol-api:patched09 manage.py test core --noinput
      - name: Build the previous 0.13.4 server
        run: |
          mkdir /tmp/baseline0134
          git archive 9cdc2eba07060f938556037ccfa2695d5681100b backend | tar -x -C /tmp/baseline0134
          docker build -t liftcontrol-api:baseline0134 /tmp/baseline0134/backend
      - name: Verify real installer and restore database with media
        run: sudo --preserve-env=GITHUB_ACTIONS python3 deploy/offline/verify-installer.py --baseline-image liftcontrol-api:baseline0134 --package /tmp/patch/LiftControl-v0.13.5-update
