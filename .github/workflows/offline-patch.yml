name: Verify compact offline update
on:
  push:
    paths: ['deploy/offline/**', 'backend/**', 'web/**', 'docs/GITHUB_UPDATES.md', 'tests/test_github_updater.py', '.github/workflows/offline-patch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    outputs:
      version: ${{ steps.package.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify updater safety and PWA worker
        run: |
          python3 -m unittest discover -s tests -p test_github_updater.py -v
          python3 -m unittest discover -s tests -p test_github_bridge.py -v
          bash -n deploy/offline/install-auto-update.sh
          node --test web/tests/pwa-worker.test.cjs
      - name: Prepare exact source update and check its manifest
        id: package
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build -- --base=/static/web/
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python -m pip download --no-deps --only-binary=:all: --dest /tmp/lc-wheels reportlab==4.4.9
          version=$(awk -F "'" '/^VERSION = / { print $2 }' backend/core/updates.py)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          archive="LiftControl-v${version}-update"
          patch_dir="/tmp/patch/$archive"
          python deploy/offline/package.py --wheel-dir /tmp/lc-wheels --commit "$GITHUB_SHA" --output "/tmp/$archive.zip"
          unzip -q "/tmp/$archive.zip" -d /tmp/patch
          cd "$patch_dir"
          test "$(cat VERSION.txt)" = "$version"
          test "$(cat SOURCE_COMMIT.txt)" = "$GITHUB_SHA"
          printf 'RELEASE_VERSION=%s\nRELEASE_PATCH_DIR=%s\n' "$version" "$patch_dir" >> "$GITHUB_ENV"
          sha256sum --check --strict PATCH.sha256
          bash -n update-panel.sh
      - name: Build the actual 0.8 baseline
        run: |
          mkdir /tmp/baseline
          git archive 90d7b0147ad51feb7f93cc39861de194574831cc backend | tar -x -C /tmp/baseline
          docker build -t liftcontrol-api:baseline08 /tmp/baseline/backend
      - name: Apply the patch with networking disabled
        run: |
          docker build --pull=false --network none --build-arg BASE_IMAGE=liftcontrol-api:baseline08 --build-arg BUILD_COMMIT="$GITHUB_SHA" -t liftcontrol-api:patched09 "$RELEASE_PATCH_DIR"
          test "$(docker inspect liftcontrol-api:patched09 --format '{{.Config.User}}')" = '10001:10001'
      - name: Verify migration preserves installed business data
        run: |
          mkdir /tmp/patch-database
          chmod 777 /tmp/patch-database
          docker run --rm -v /tmp/patch-database:/check -e DJANGO_DEBUG=True -e DB_ENGINE=sqlite -e DJANGO_SQLITE_PATH=/check/db.sqlite3 --entrypoint sh liftcontrol-api:baseline08 -ec "python manage.py migrate --noinput; python manage.py shell -c \"from core.models import Building,Elevator,Ticket,Document; b=Building.objects.create(name='Keep building',address='Keep address'); e=Elevator.objects.create(building=b,inventory_number='KEEP-001'); Ticket.objects.create(elevator=e,title='Keep ticket',description='Keep report'); Document.objects.create(organization_id=1,title='Keep document',manufacturer='MEL',file='private/keep.pdf')\""
          docker run --rm -v /tmp/patch-database:/check -e DJANGO_DEBUG=True -e DB_ENGINE=sqlite -e DJANGO_SQLITE_PATH=/check/db.sqlite3 -e RELEASE_VERSION --entrypoint sh liftcontrol-api:patched09 -ec "python manage.py migrate --noinput; python manage.py shell -c \"from core.models import Ticket,Elevator,Document,MobileSyncReceipt; assert Ticket.objects.get().description=='Keep report'; assert Elevator.objects.get().inventory_number=='KEEP-001'; assert Document.objects.get().deleted_at is None; assert not MobileSyncReceipt.objects.exists(); import os; from django.test import Client; d=Client(HTTP_HOST='localhost').get('/api/health/').json(); assert d['version']==os.environ['RELEASE_VERSION'] and d['offline_sync_api']==1; print('INSTALLED DATA AND API VERIFIED')\""
      - name: Run all server checks in the patched image
        run: docker run --rm --tmpfs /tmp:rw,mode=1777 -e DJANGO_DEBUG=True -e DB_ENGINE=sqlite -e DJANGO_SQLITE_PATH=/tmp/check.sqlite3 --entrypoint python liftcontrol-api:patched09 manage.py test core --noinput
      - name: Build the previous 0.13.8 server
        run: |
          mkdir /tmp/baseline0138
          git archive 549bfeba8589a731e968b751884e4c48c9fb8e1e backend | tar -x -C /tmp/baseline0138
          docker build -t liftcontrol-api:baseline0138 /tmp/baseline0138/backend
      - name: Verify real installer and restore database with media
        run: sudo --preserve-env=GITHUB_ACTIONS python3 deploy/offline/verify-installer.py --baseline-image liftcontrol-api:baseline0138 --package "$RELEASE_PATCH_DIR"

      - name: Upload verified compact server update
        uses: actions/upload-artifact@v4
        with:
          name: LiftControl-v${{ env.RELEASE_VERSION }}-server
          path: /tmp/LiftControl-v${{ env.RELEASE_VERSION }}-update.zip
          if-no-files-found: error
          retention-days: 30

  publish-pwa:
    if: github.ref == 'refs/heads/main' && needs.patch.outputs.version != ''
    needs: patch
    runs-on: ubuntu-24.04
    concurrency:
      group: liftcontrol-stable-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.patch.outputs.version }}
    steps:
      - name: Check explicit release marker and existing tag
        id: gate
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          marker=$(gh api "repos/$GH_REPO/contents/deploy/offline/release-version.txt?ref=$GITHUB_SHA" --jq .content | base64 -d)
          if [[ "$marker" != "$RELEASE_VERSION" ]]; then
            echo 'No explicit release marker for this version.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release already exists; no replacement.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          name: LiftControl-v${{ needs.patch.outputs.version }}-server
      - name: Confirm exact tested package
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          archive="LiftControl-v$RELEASE_VERSION-update.zip"
          test -s "$archive"
          unzip -p "$archive" "LiftControl-v$RELEASE_VERSION-update/SOURCE_COMMIT.txt" | grep -Fx "$GITHUB_SHA"
          sha256sum "$archive" > "$archive.sha256"
      - name: Sign build provenance
        if: steps.gate.outputs.publish == 'true'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: LiftControl-v${{ needs.patch.outputs.version }}-update.zip
      - name: Verify public bundle without a token before publication
        if: steps.gate.outputs.publish == 'true'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          archive="LiftControl-v$RELEASE_VERSION-update.zip"
          cp "$BUNDLE_PATH" "$archive.intoto.jsonl"
          env -u GH_TOKEN -u GITHUB_TOKEN GH_CONFIG_DIR="$(mktemp -d)" GH_PROMPT_DISABLED=1 gh attestation verify "$archive" --bundle "$archive.intoto.jsonl" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/offline-patch.yml" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
      - name: Publish checked release without replacing an existing one
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          archive="LiftControl-v$RELEASE_VERSION-update.zip"
          tag="v$RELEASE_VERSION"
          gh release create "$tag" "$archive" "$archive.sha256" "$archive.intoto.jsonl" --target "$GITHUB_SHA" --draft --title "LiftControl $RELEASE_VERSION — PWA" --notes "Сервер и PWA. Проверенный пакет с подписанной аттестацией. APK заморожен. Перед включением автообновлений проверьте на стенде."
          gh release edit "$tag" --draft=false --latest
