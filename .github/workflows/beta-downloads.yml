name: Prepare private beta downloads
on:
  push:
    paths: ['.github/workflows/beta-downloads.yml']
  workflow_dispatch:
permissions:
  contents: write  # GitHub requires push access to view private draft releases.
jobs:
  resolve:
    name: Resolve ${{ matrix.kind }} download
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: server
            commit: 5e316b897b514018916d755c97b0cde4f7820dee
            filename: LiftControl-v0.9-amd64.zip
    steps:
      - name: Resolve a bounded private download without exposing repository credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ matrix.commit }}
          TARGET_FILENAME: ${{ matrix.filename }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,re,time,urllib.request,urllib.error,urllib.parse
          repository=os.environ['REPOSITORY']
          expected=os.environ['TARGET_COMMIT']
          name=os.environ['TARGET_FILENAME']
          assert re.fullmatch(r'[a-f0-9]{40}',expected)
          base='https://api.github.com/repos/'+repository
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Cache-Control':'no-cache'}
          asset=None
          for attempt in range(120):
              with urllib.request.urlopen(urllib.request.Request(base+'/releases?per_page=100',headers=headers),timeout=30) as response:
                  releases=json.load(response)
              for release in releases:
                  if release['target_commitish'] != expected: continue
                  asset=next((a for a in release['assets'] if a['name']==name),None)
                  if asset: break
              if asset: break
              print('Waiting for verified build '+name,flush=True)
              time.sleep(10)
          if asset is None: raise RuntimeError('VERIFIED_RELEASE_ASSET_NOT_READY')
          assert asset['url'].startswith(base+'/releases/assets/')
          assert 0<int(asset['size'])<=600*1024*1024
          digest=asset.get('digest','').removeprefix('sha256:')
          assert re.fullmatch(r'[a-f0-9]{64}',digest)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          download_headers={**headers,'Accept':'application/octet-stream'}
          try:
              result=opener.open(urllib.request.Request(asset['url'],headers=download_headers),timeout=30)
          except urllib.error.HTTPError as error:
              if error.code not in (301,302,303,307,308): raise
              location=error.headers['Location'];error.close()
          else:
              result.close();raise RuntimeError('EXPECTED_PRIVATE_ASSET_REDIRECT')
          uri=urllib.parse.urlsplit(location)
          assert uri.scheme=='https' and uri.hostname.endswith('.githubusercontent.com')
          assert uri.username is None and uri.password is None
          print('LC_PRIVATE_FILE '+json.dumps({'name':name,'size':asset['size'],'sha256':digest,'commit':expected,'url':location}),flush=True)
          PY
