name: Android APK and device tests
on:
  push:
    paths: ['mobile/**', 'backend/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Restore private beta test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: liftcontrol-private-beta-signing-v1
      - name: Create beta key if no cache exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=LiftControl Beta,O=LiftControl,C=RU'
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - name: Build optimized ARM64 beta APK
        env:
          LIFTCONTROL_BETA: 'true'
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number=${{ github.run_number }} --dart-define=BUILD_COMMIT=${{ github.sha }}
      - name: Verify signature and create download
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/LiftControl-Android-0.1.0-beta-arm64.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs release/LiftControl-Android-0.1.0-beta-arm64.apk > release/SIGNATURE.txt
          printf '%s\n' '${{ github.sha }}' > release/SOURCE_COMMIT.txt
          cp README.md release/ANDROID-README.md
          cd release
          sha256sum LiftControl-Android-0.1.0-beta-arm64.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: LiftControl-Android-0.1.0-beta-arm64
          path: mobile/release/
          retention-days: 30
          if-no-files-found: error
  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DJANGO_DEBUG: 'True'
      DJANGO_SQLITE_PATH: /tmp/mobile-ci-db.sqlite3
      DJANGO_MEDIA_ROOT: /tmp/mobile-ci-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Start isolated Django fixture
        run: |
          python -m pip install -r backend/requirements.txt
          python backend/manage.py migrate --noinput
          python mobile/tool/seed_ci.py
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/mobile-ci-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/api/health/ && break || sleep 1; done
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Android 35 end-to-end test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb reverse tcp:18081 tcp:8000
            cd mobile
            flutter pub get --enforce-lockfile
            flutter drive --no-pub --driver=test_driver/integration_test.dart --target=integration_test/workflow_test.dart --dart-define=BUILD_COMMIT=${{ github.sha }}
      - name: Verify persisted business state
        run: |
          python backend/manage.py shell -c "from core.models import Ticket,MobileSession; t=Ticket.objects.get(); assert t.status=='DONE'; assert t.photos.count()==1; assert t.comments.count()==2; assert not MobileSession.objects.filter(revoked_at__isnull=True).exists(); print('ANDROID TO DJANGO VERIFIED')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-diagnostics-and-screenshots
          path: |
            mobile/test-output/
            mobile/build/integration_response_data.json
            /tmp/mobile-ci-api.log
          retention-days: 14
          if-no-files-found: ignore
