name: Android APK and device tests
on:
  push:
    paths: ['mobile/**', 'backend/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  BOT: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Restore private beta test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: liftcontrol-private-beta-signing-v1
      - name: Select preserved signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.LIFTCONTROL_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            python - <<'PYCODE'
          import base64,os,pathlib
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'liftcontrol-signing.keystore'
          path.write_bytes(base64.b64decode(os.environ['SIGNING_KEY_BASE64'],validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write('LIFTCONTROL_SIGNING_KEY='+str(path)+'\n')
          PYCODE
          elif [ -s "$HOME/.android/debug.keystore" ]; then
            printf 'LIFTCONTROL_SIGNING_KEY=%s\n' "$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          else
            echo 'SIGNING_KEY_MISSING: restore the preserved key or configure LIFTCONTROL_ANDROID_KEYSTORE_BASE64. A replacement key is never generated automatically.'
            exit 1
          fi
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib test integration_test test_driver
      - name: Print source formatting patch
        run: git diff -- lib test integration_test test_driver
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - name: Verify official Gradle distribution
        run: python tool/prepare_gradle.py
      - name: Build optimized ARM64 beta APK
        env:
          LIFTCONTROL_BETA: 'true'
          LIFTCONTROL_KEYSTORE_PASSWORD: ${{ secrets.LIFTCONTROL_ANDROID_KEYSTORE_PASSWORD || 'android' }}
          LIFTCONTROL_KEY_ALIAS: ${{ secrets.LIFTCONTROL_ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          LIFTCONTROL_KEY_PASSWORD: ${{ secrets.LIFTCONTROL_ANDROID_KEY_PASSWORD || 'android' }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-number=${{ github.run_number }} --dart-define=BUILD_COMMIT=${{ github.sha }}
      - name: Verify signature and create download
        env:
          EXPECTED_SIGNER_SHA256: ${{ secrets.LIFTCONTROL_ANDROID_CERT_SHA256 || '7692c3fedf4b66ac2673a29326c8fb7fbc73db91af1dcee889dacbe008e32683' }}
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/LiftControl-Android-0.6.0-beta-arm64.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs release/LiftControl-Android-0.6.0-beta-arm64.apk > release/SIGNATURE.txt
          actual=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' release/SIGNATURE.txt | head -1)
          [[ "$actual" == "$EXPECTED_SIGNER_SHA256" ]] || { echo 'UNEXPECTED_SIGNING_CERTIFICATE: APK cannot be released as an update'; exit 1; }
          echo "PRESERVED_BETA_SIGNER_VERIFIED $actual"
          printf '%s\n' '${{ github.sha }}' > release/SOURCE_COMMIT.txt
          cp README.md release/ANDROID-README.md
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$aapt" dump badging release/LiftControl-Android-0.6.0-beta-arm64.apk > release/APK-METADATA.txt
          python - <<'PYCODE'
          import hashlib,json,pathlib,re
          apk=pathlib.Path('release/LiftControl-Android-0.6.0-beta-arm64.apk')
          code=int(re.search(r"versionCode='([0-9]+)'",pathlib.Path('release/APK-METADATA.txt').read_text())[1])
          pathlib.Path('release/android-release.json').write_text(json.dumps({'android':{'filename':apk.name,'version':'0.6.0-beta','version_code':code,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'size':apk.stat().st_size,'notes':'Медиатека, единое хранилище и надёжная отправка вложений без интернета'}},ensure_ascii=False,indent=2))
          PYCODE
          cd release
          sha256sum LiftControl-Android-0.6.0-beta-arm64.apk > SHA256SUMS
      - name: Package the verified beta build
        run: |
          python - <<'PYCODE'
          import hashlib,json,pathlib,zipfile
          target=pathlib.Path('LiftControl-Android-0.6.0-beta-arm64.zip')
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as archive:
            for path in sorted(pathlib.Path('release').iterdir()):
              if path.is_file(): archive.write(path,path.name)
          print('LC_BUILD_PACKAGE '+json.dumps({'filename':target.name,'size':target.stat().st_size,'sha256':hashlib.sha256(target.read_bytes()).hexdigest()}))
          PYCODE
      - uses: actions/upload-artifact@v4
        id: apk-artifact
        continue-on-error: true
        with:
          name: LiftControl-Android-0.6.0-beta-arm64
          path: mobile/release/
          retention-days: 30
          if-no-files-found: error
      - name: Retain the compiled application when artifact storage is full
        if: steps.apk-artifact.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: mobile/LiftControl-Android-0.6.0-beta-arm64.zip
          key: compiled-liftcontrol-beta-${{ github.sha }}
      - name: Save beta in a private draft release when artifact quota is full
        if: steps.apk-artifact.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_label=${GITHUB_REF_NAME//\//-}
          release_tag="preview-${branch_label}-${GITHUB_SHA:0:12}"
          if ! gh release view "$release_tag" > /dev/null 2>&1; then
            gh release create "$release_tag" --draft --prerelease --target "$GITHUB_SHA" --title 'LiftControl 0.11 / Android 0.6.0 beta' --notes 'Тестовая сборка. Перед установкой сервера прочитайте deploy/offline/UPDATE.md. FCM требует отдельной настройки Firebase.' || gh release view "$release_tag"
          fi
          gh release upload "$release_tag" LiftControl-Android-0.6.0-beta-arm64.zip release/LiftControl-Android-0.6.0-beta-arm64.apk --clobber
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DJANGO_DEBUG: 'True'
      DJANGO_SQLITE_PATH: /tmp/mobile-ci-db.sqlite3
      DJANGO_MEDIA_ROOT: /tmp/mobile-ci-media
    steps:
      - uses: actions/checkout@v4
      - name: Free unused toolchains on this disposable Android test runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Start isolated Django fixture
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install -r backend/requirements.txt
          python backend/manage.py migrate --noinput
          python mobile/tool/seed_ci.py
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/mobile-ci-api.log 2>&1 &
          python mobile/tool/offline_proxy.py > /tmp/mobile-ci-offline-proxy.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/api/health/ && break || sleep 1; done
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Keep test compiler memory within the runner capacity
        run: |
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
          org.gradle.workers.max=2
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES
      - name: Verify official Gradle distribution
        working-directory: mobile
        run: python tool/prepare_gradle.py
      - name: Build the Android test app before starting the emulator
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug --target-platform android-x64 --target=integration_test/workflow_test.dart --dart-define=BUILD_COMMIT=${{ github.sha }}
      - name: Release compiler memory before booting Android
        working-directory: mobile/android
        run: |
          ./gradlew --stop
          free -h
      - name: Android 35 end-to-end test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 300
          working-directory: mobile
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb reverse tcp:18081 tcp:18082
            adb reverse tcp:18083 tcp:18083
            flutter drive --no-pub --use-application-binary=build/app/outputs/flutter-apk/app-debug.apk --driver=test_driver/integration_test.dart --target=integration_test/workflow_test.dart --dart-define=BUILD_COMMIT=${{ github.sha }}
      - name: Verify persisted business state
        run: |
          python backend/manage.py shell -c "from core.models import Ticket,MobileSession; t=Ticket.objects.get(); assert t.status=='DONE'; assert t.photos.count()==1; assert t.comments.count()==2; from core.models import MobileSyncReceipt; assert MobileSyncReceipt.objects.filter(ticket=t).count()==6; assert t.stop_reason=='Ожидаем запасную плату'; assert t.elevator.stopped_at is None; from core.models import Membership; assert Membership.objects.filter(user__username='ci-created-mechanic',role='MECHANIC').exists(); assert not MobileSession.objects.filter(revoked_at__isnull=True).exists(); from core.models import PersonalTask,ChatMessage; assert PersonalTask.objects.get().status=='DONE'; assert ChatMessage.objects.count()==2; assert sorted(m.attachments.count() for m in ChatMessage.objects.all())==[1,2]; from core.models import MediaAsset,MediaUploadReceipt; assert MediaAsset.objects.count()==2; assert MediaUploadReceipt.objects.count()==3; print('ANDROID TO DJANGO VERIFIED')"
      - name: Show isolated server diagnostics if the device check fails
        if: failure()
        run: |
          tail -n 80 /tmp/mobile-ci-api.log
          python backend/manage.py shell -c "from core.models import Ticket,Membership; print(list(Ticket.objects.values('id','status','stop_reason'))); print(list(Membership.objects.values('role','active')))"
          free -h
          sudo dmesg --ctime > /tmp/mobile-ci-kernel.log || true
          tail -n 40 /tmp/mobile-ci-kernel.log
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: Android-device-diagnostics-and-screenshots
          path: |
            mobile/test-output/
            mobile/build/integration_response_data.json
            /tmp/mobile-ci-api.log
          retention-days: 14
          if-no-files-found: ignore
