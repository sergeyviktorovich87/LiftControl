name: Mobile tickets list UI
on:
  push:
    branches: [main, codex/mobile-tickets-list]
    paths: ['web/**', '.github/workflows/tickets-mobile-ui.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/tickets-mobile-ui.yml']
permissions:
  contents: read
jobs:
  commissioning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Start local ticket UI
        run: |
          npm --prefix web run dev -- --host 127.0.0.1 --port 5173 > /tmp/tickets-mobile-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tickets-mobile-vite.log
          exit 1
      - name: Check mobile ticket list, archive, filters, permissions and responsive widths
        run: |
          export TICKET_CHROME="$(command -v google-chrome || command -v chromium)"
          node web/tool/check-tickets-mobile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tickets-mobile-ui-diagnostics
          path: |
            /tmp/lift-tickets-list-*.png
            /tmp/tickets-mobile-vite.log
          if-no-files-found: ignore
