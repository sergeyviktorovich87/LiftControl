name: Vacation and duty planning UI
on:
  push:
    branches: [main, codex/vacation-duty-planning]
    paths: ['web/**', '.github/workflows/planning-ui.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/planning-ui.yml']
permissions:
  contents: read
jobs:
  planning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Start local planning UI
        run: |
          npm --prefix web run dev -- --host 127.0.0.1 --port 5173 > /tmp/planning-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/planning-vite.log
          exit 1
      - name: Check vacation workflow, duty drafts, publication and PWA sizes
        run: |
          export PLANNING_CHROME="$(command -v google-chrome || command -v chromium)"
          node web/tool/check-planning.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-ui-diagnostics
          path: |
            /tmp/lift-planning-*.png
            /tmp/planning-vite.log
          if-no-files-found: ignore
