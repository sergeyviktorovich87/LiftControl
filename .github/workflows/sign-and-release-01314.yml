# Preserved beta signing: only the original branch can read its legacy key cache.
# Application source is pinned to the previously checked 0.13.14 candidate.
# No keystore, password or private key is ever included in an output artifact.
name: Sign preserved Android 0.13.14 beta
on:
  push:
    branches: [feature/android-client]
    paths: ['.github/workflows/sign-and-release-01314.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liftcontrol-preserved-beta-signing
  cancel-in-progress: true
jobs:
  signed-beta:
    if: github.repository == 'sergeyviktorovich87/LiftControl' && github.ref == 'refs/heads/feature/android-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: mobile
    env:
      CI: 'true'
      BOT: 'true'
      LIFTCONTROL_BETA: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      SOURCE_COMMIT: e3751780a7799fd85031e63c45ea9172f72b0a6a
      EXPECTED_SIGNER: 7692c3fedf4b66ac2673a29326c8fb7fbc73db91af1dcee889dacbe008e32683
    steps:
      - name: Check that the approved release is part of main
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_COMMIT" --jq .tree.sha)" = 'c9ac9ce8227f62bcd87cfbcd72f11aa83f0b0cdd'
          test "$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_COMMIT...main" --jq .status)" = identical
      - name: Check out the verified application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e3751780a7799fd85031e63c45ea9172f72b0a6a
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Analyze and test the exact release source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded
          python tool/prepare_gradle.py
      - name: Restore the existing beta key without creating or saving a replacement
        id: preserved-key
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.android/debug.keystore
          key: liftcontrol-private-beta-signing-v1
          fail-on-cache-miss: true
      - name: Verify the certificate before using the key
        env:
          LIFTCONTROL_KEYSTORE_PASSWORD: android
        run: |
          set -euo pipefail
          test '${{ steps.preserved-key.outputs.cache-hit }}' = 'true'
          test -s "$HOME/.android/debug.keystore"
          install -m 600 "$HOME/.android/debug.keystore" "$RUNNER_TEMP/liftcontrol-preserved-beta.keystore"
          actual=$(keytool -exportcert -keystore "$RUNNER_TEMP/liftcontrol-preserved-beta.keystore" -alias androiddebugkey -storepass:env LIFTCONTROL_KEYSTORE_PASSWORD | openssl dgst -sha256 | awk '{print $NF}')
          test "$actual" = "$EXPECTED_SIGNER" || { echo 'UNEXPECTED_SIGNING_CERTIFICATE'; exit 1; }
          printf 'LIFTCONTROL_SIGNING_KEY=%s\n' "$RUNNER_TEMP/liftcontrol-preserved-beta.keystore" >> "$GITHUB_ENV"
          echo 'PRESERVED_BETA_SIGNER_VERIFIED'
      - name: Build Android 0.13.14 with the preserved beta signer
        env:
          LIFTCONTROL_KEYSTORE_PASSWORD: android
          LIFTCONTROL_KEY_ALIAS: androiddebugkey
          LIFTCONTROL_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64 --build-name=0.13.14 --build-number=3770 --dart-define="BUILD_COMMIT=$SOURCE_COMMIT"
      - name: Verify the installable APK and create a signed release manifest
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/LiftControl-Android-0.13.14-beta-arm64.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs release/LiftControl-Android-0.13.14-beta-arm64.apk > release/SIGNATURE.txt
          actual=$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V2 Signer: certificate SHA-256 digest: //p' release/SIGNATURE.txt | head -1)
          test "$actual" = "$EXPECTED_SIGNER" || { echo 'APK_SIGNER_MISMATCH'; exit 1; }
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$aapt" dump badging release/LiftControl-Android-0.13.14-beta-arm64.apk > release/APK-METADATA.txt
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('release')
          apk = root / 'LiftControl-Android-0.13.14-beta-arm64.apk'
          raw = (root / 'APK-METADATA.txt').read_text()
          package = re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'", raw)
          assert package, 'Missing APK package metadata'
          assert package.group(1) == 'ru.liftcontrol.app.beta', 'Unexpected application ID'
          assert int(package.group(2)) == 5770, 'Expected Android ARM64 build 5770'
          assert package.group(3) == '0.13.14', 'Unexpected version name'
          assert "native-code: 'arm64-v8a'" in raw, 'Unexpected ABI'
          assert not re.search(r'^application-debuggable', raw, re.M), 'Release must not be debuggable'
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          meta = {'android': {'filename': apk.name, 'version': '0.13.14', 'version_code': int(package.group(2)), 'sha256': sha, 'size': apk.stat().st_size, 'notes': 'Новый чат, фото шильдиков устройств безопасности и номер лифта вместо подъезда.'}}
          (root / 'android-release.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n')
          (root / 'SOURCE_COMMIT.txt').write_text(os.environ['SOURCE_COMMIT'] + '\n')
          (root / 'SHA256SUMS').write_text(sha + '  ' + apk.name + '\n')
          print('SIGNED_ANDROID_BETA_VERIFIED versionCode=' + package.group(2))
          PY
          cp ../deploy/api/PUBLISH-ANDROID.md release/PUBLISH-ANDROID.md
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('LiftControl-Android-0.13.14-beta-arm64.zip', 'w', ZIP_DEFLATED) as out:
              for path in sorted(Path('release').iterdir()):
                  assert path.suffix not in ('.jks', '.keystore'), 'Signing key cannot be published'
                  if path.is_file():
                      out.write(path, path.name)
          PY
      - name: Remove the signing key from this disposable runner
        working-directory: .
        if: always()
        run: rm -f "$RUNNER_TEMP/liftcontrol-preserved-beta.keystore" "$HOME/.android/debug.keystore"
      - name: Upload the signed beta and verification results
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LiftControl-Android-0.13.14-beta-signed
          path: mobile/release/
          retention-days: 30
          if-no-files-found: error
      - name: Package and verify the Android server update
        working-directory: .
        run: |
          set -euo pipefail
          python deploy/api/package-android-update.py mobile/LiftControl-Android-0.13.14-beta-arm64.zip --output mobile/release/LiftControl-Android-0.13.14-update.zip
          unzip -q mobile/release/LiftControl-Android-0.13.14-update.zip -d "$RUNNER_TEMP/liftcontrol-android-check"
          (cd "$RUNNER_TEMP/liftcontrol-android-check/LiftControl-Android-update" && sha256sum --check --strict PACKAGE.sha256 && bash -n publish-android.sh)
          (cd mobile/release && sha256sum ./*.apk ./*.zip > SHA256SUMS)
      - name: Wait for release checks on the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="repos/$GITHUB_REPOSITORY"
          deadline=$((SECONDS + 1200))
          for workflow in android.yml backend-tests.yml chat-ui.yml; do
            while true; do
              if [[ "$workflow" == chat-ui.yml ]]; then
                # A server-test-only commit does not trigger the web-only job.
                # Reuse its result only after proving its complete web tree is unchanged.
                runs=$(gh api --method GET "$repository/actions/workflows/$workflow/runs" -f branch=main -f event=push -f per_page=5)
                checked_source=$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$runs")
                if [[ -n "$checked_source" && "$checked_source" != "$SOURCE_COMMIT" ]]; then
                  gh api "$repository/compare/$checked_source...$SOURCE_COMMIT" > "$RUNNER_TEMP/chat-source-comparison.json"
                  python - "$RUNNER_TEMP/chat-source-comparison.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          files = data.get('files', [])
          assert data.get('status') in ('ahead', 'identical') and len(files) < 300
          assert not any(f['filename'].startswith('web/') or f['filename'] == '.github/workflows/chat-ui.yml' for f in files), 'Web source differs from tested source'
          PY
                fi
              else
                runs=$(gh api --method GET "$repository/actions/workflows/$workflow/runs" -f branch=main -f event=push -f head_sha="$SOURCE_COMMIT" -f per_page=5)
              fi
              id=$(jq -r '.workflow_runs[0].id // empty' <<<"$runs")
              status=$(jq -r '.workflow_runs[0].status // empty' <<<"$runs")
              conclusion=$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$runs")
              if [[ "$status" == completed && "$conclusion" == success ]]; then
                echo "RELEASE_CHECK_PASSED $workflow $id"
                break
              fi
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                echo "RELEASE_CHECK_FAILED $workflow $id $conclusion"
                exit 1
              fi
              if (( SECONDS >= deadline )); then
                echo "RELEASE_CHECK_TIMEOUT $workflow $id ${status:-missing}"
                exit 1
              fi
              echo "Waiting for $workflow (${status:-missing})"
              sleep 20
            done
          done
      - name: Prepare matching panel archive
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Package panel from the exact same source
        working-directory: .
        run: |
          set -euo pipefail
          npm ci --prefix web --no-audit --no-fund
          npm --prefix web run build -- --base=/static/web/
          python -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/lc-wheels" reportlab==4.4.9
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          fi
          python deploy/offline/package.py --wheel-dir "$RUNNER_TEMP/lc-wheels" --commit "$SOURCE_COMMIT" --output mobile/release/LiftControl-v0.13.14-update.zip
          (cd mobile/release && sha256sum ./*.apk ./*.zip > SHA256SUMS)
      - name: Publish verified Android 0.13.14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$SOURCE_COMMIT"
          notes="$RUNNER_TEMP/liftcontrol-01314-notes.md"
          cat > "$notes" <<'NOTES'
          - Новый общий «Чат» в панели и Android: ответы, поиск, копирование и закрепление.
          - «Шильдики» в наладке и выбор «Подъезд / Номер лифта». Сначала установите сервер 0.13.14.
          - APK ARM64 обновляет действующую beta и включает диагностические логи.
          NOTES
          gh release create v0.13.14 \
            release/LiftControl-Android-0.13.14-beta-arm64.apk \
            release/LiftControl-Android-0.13.14-update.zip \
            release/LiftControl-v0.13.14-update.zip \
            release/android-release.json release/SHA256SUMS release/SIGNATURE.txt \
            --repo "$GITHUB_REPOSITORY" --prerelease --target "$SOURCE_COMMIT" \
            --title 'Лифт Контроль 0.13.14 · Android beta' --notes-file "$notes"
