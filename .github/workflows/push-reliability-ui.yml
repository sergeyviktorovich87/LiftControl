name: Push subscription and delivery reliability
on:
  push:
    branches: [main, codex/push-reliability]
    paths: ['web/**', '.github/workflows/push-reliability-ui.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/push-reliability-ui.yml']
permissions:
  contents: read
jobs:
  commissioning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Start local ticket UI
        run: |
          npm --prefix web run dev -- --host 127.0.0.1 --port 5173 > /tmp/push-reliability-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/push-reliability-vite.log
          exit 1
      - name: Check push recovery, probe and intentional opt-out
        run: |
          export PUSH_CHROME="$(command -v google-chrome || command -v chromium)"
          node web/tool/check-push-reliability.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: push-reliability-ui-diagnostics
          path: |
            /tmp/lift-push-reliability-*.png
            /tmp/push-reliability-vite.log
          if-no-files-found: ignore
