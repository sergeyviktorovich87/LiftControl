name: Django backend tests

on:
  push:
    paths:
      - 'backend/**'
      - 'deploy/api/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy/api/**'

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify migrations are committed
        env:
          DJANGO_DEBUG: "True"
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run core
      - name: Migrate development database and run tests
        env:
          DJANGO_DEBUG: "True"
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py test core --verbosity 2
      - name: Docker image smoke build
        run: docker build -t liftcontrol-api:test backend
