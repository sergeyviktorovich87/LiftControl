name: Django backend tests

on:
  push:
    paths:
      - 'backend/**'
      - 'web/**'
      - 'deploy/api/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy/api/**'

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: liftcontrol
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liftcontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify migrations are committed
        env:
          DJANGO_DEBUG: "True"
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run core
      - name: Migrate development database and run tests
        env:
          DJANGO_DEBUG: "True"
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py test core --verbosity 2
      - name: Verify PostgreSQL schema and non-admin runtime role
        working-directory: backend
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-only-test-secret-key-longer-than-thirty-two-chars"
          DB_ENGINE: postgresql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: liftcontrol
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("host=127.0.0.1 user=postgres password=ci-only-admin dbname=liftcontrol") as db:
              db.execute("CREATE ROLE liftapp LOGIN PASSWORD 'ci-only-app'")
              db.execute("CREATE SCHEMA app AUTHORIZATION postgres")
              db.execute("GRANT USAGE ON SCHEMA app TO liftapp")
              db.execute("ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA app GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO liftapp")
              db.execute("ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA app GRANT USAGE, SELECT ON SEQUENCES TO liftapp")
          PY
          DB_USER=postgres DB_PASSWORD=ci-only-admin python manage.py migrate --noinput
          DB_USER=liftapp DB_PASSWORD=ci-only-app python manage.py check
          DB_USER=liftapp DB_PASSWORD=ci-only-app python manage.py shell -c "from core.models import Building; b=Building.objects.create(name='CI test',address='CI address'); assert Building.objects.filter(pk=b.pk).exists(); print('POSTGRES RUNTIME OK')"
      - name: Exercise permissions, files, planning and legacy migration on PostgreSQL
        working-directory: backend
        env:
          DJANGO_DEBUG: "True"
          DB_ENGINE: postgresql
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: liftcontrol
          DB_USER: postgres
          DB_PASSWORD: ci-only-admin
        run: python manage.py test core --verbosity 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build existing React dashboard
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --base=/static/web/
      - name: Embed React in Django static files
        run: |
          mkdir -p backend/static/web
          cp -a web/dist/assets backend/static/web/
          cp web/dist/index.html backend/templates/index.html
          grep -q '/static/web/assets/' backend/templates/index.html
      - name: Validate safe 0.5 upgrade script syntax
        run: bash -n deploy/api/update-v05.sh
      - name: Docker image smoke build
        run: |
          bash -n deploy/api/update-v04.sh
          docker build -t liftcontrol-api:test backend
          docker run --rm --entrypoint python liftcontrol-api:test -c "from pathlib import Path; assert Path('/app/templates/index.html').exists(); assert list(Path('/app/staticfiles/web/assets').glob('*.js')); print('WEB BUNDLE OK')"


          docker run --rm --read-only --user 10001:10001 --cap-drop ALL --network none -v test_private_media:/app/private_media --entrypoint python liftcontrol-api:test -c "from pathlib import Path; p=Path('/app/private_media/probe'); p.write_text('persisted'); print('MEDIA WRITE OK')"
          docker run --rm --read-only --user 10001:10001 --cap-drop ALL --network none -v test_private_media:/app/private_media --entrypoint python liftcontrol-api:test -c "from pathlib import Path; p=Path('/app/private_media/probe'); assert p.read_text()=='persisted'; p.unlink(); print('MEDIA PERSISTENCE OK')"
          docker volume rm test_private_media
