name: Home condition and PWA photo navigation UI
on:
  push:
    branches: [main, codex/home-condition]
    paths: ['web/**', '.github/workflows/home-upgrade-ui.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/home-upgrade-ui.yml']
permissions:
  contents: read
jobs:
  commissioning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Start local ticket UI
        run: |
          npm --prefix web run dev -- --host 127.0.0.1 --port 5173 > /tmp/home-upgrade-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/home-upgrade-vite.log
          exit 1
      - name: Check repair panels, weekly history, PWA photo Back and optional entrapment description
        run: |
          export PUSH_CHROME="$(command -v google-chrome || command -v chromium)"
          node web/tool/check-home-upgrade.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-upgrade-ui-diagnostics
          path: |
            /tmp/lift-home-upgrade-*.png
            /tmp/home-upgrade-vite.log
          if-no-files-found: ignore
