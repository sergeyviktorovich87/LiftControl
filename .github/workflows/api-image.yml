name: Build downloadable LiftControl API image

on:
  push:
    paths:
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/api-image.yml'
      - 'deploy/api/**'
      - 'deploy/public/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build React dashboard assets
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --base=/static/web/
      - name: Embed assets into Django static files
        run: |
          mkdir -p backend/static/web
          cp -a web/dist/assets backend/static/web/
          cp web/dist/index.html backend/templates/index.html
          grep -q '/static/web/assets/' backend/templates/index.html
      - name: Build Linux AMD64 image
        run: |
          docker build --platform linux/amd64 --build-arg BUILD_COMMIT="$GITHUB_SHA" -t liftcontrol-api:0.6 ./backend
          docker image inspect liftcontrol-api:0.6 --format '{{.Os}}/{{.Architecture}} {{.Id}}'
      - name: Verify Django is included
        run: |
          docker run --rm --entrypoint python liftcontrol-api:0.6 -c "import django,psycopg,gunicorn;print('API IMAGE VERIFIED',django.get_version())"
      - name: Export offline-installable archive
        run: |
          docker save liftcontrol-api:0.6 | gzip -1 > liftcontrol-api-v06-amd64.tar.gz
          gzip -t liftcontrol-api-v06-amd64.tar.gz
          sha256sum liftcontrol-api-v06-amd64.tar.gz > liftcontrol-api-v06-amd64.tar.gz.sha256
          ls -lh liftcontrol-api-v06-amd64.tar.gz
      - name: Include installer and release instructions
        run: |
          cp deploy/api/update-android.sh deploy/api/UPDATE-ANDROID.md deploy/api/update-panel.sh deploy/api/setup-updates.sh deploy/api/publish-update.py deploy/api/configure-fcm.py deploy/api/compose.updates.yaml deploy/api/compose.fcm.yaml deploy/api/UPDATE-v07.md .
          cp deploy/api/update-v06.sh deploy/api/patch-v06-safe.sh deploy/api/PATCH-EMPLOYEE-v06.md deploy/api/compose.v06.yaml deploy/api/UPDATE-v06.md deploy/api/configure-push.sh deploy/api/compose.push.yaml .
          cp deploy/public/access.py deploy/public/setup-public.sh deploy/public/install-v06-with-https.sh deploy/public/renew-public.sh deploy/public/status-public.sh deploy/public/rollback-public.sh .
          cp deploy/public/README.md PUBLIC-HTTPS.md
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
          sha256sum update-panel.sh setup-updates.sh publish-update.py configure-fcm.py compose.updates.yaml compose.fcm.yaml UPDATE-v07.md update-android.sh UPDATE-ANDROID.md liftcontrol-api-v06-amd64.tar.gz update-v06.sh patch-v06-safe.sh PATCH-EMPLOYEE-v06.md compose.v06.yaml UPDATE-v06.md configure-push.sh compose.push.yaml SOURCE_COMMIT.txt access.py setup-public.sh install-v06-with-https.sh renew-public.sh status-public.sh rollback-public.sh PUBLIC-HTTPS.md > RELEASE.sha256
      - name: Upload private artifact
        id: server-artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LiftControl-v0.7-amd64
          path: |
            liftcontrol-api-v06-amd64.tar.gz
            liftcontrol-api-v06-amd64.tar.gz.sha256
            update-v06.sh
            patch-v06-safe.sh
            PATCH-EMPLOYEE-v06.md
            update-panel.sh
            setup-updates.sh
            publish-update.py
            configure-fcm.py
            compose.updates.yaml
            compose.fcm.yaml
            UPDATE-v07.md
            update-android.sh
            UPDATE-ANDROID.md
            compose.v06.yaml
            UPDATE-v06.md
            SOURCE_COMMIT.txt
            configure-push.sh
            compose.push.yaml
            RELEASE.sha256
            access.py
            setup-public.sh
            install-v06-with-https.sh
            renew-public.sh
            status-public.sh
            rollback-public.sh
            PUBLIC-HTTPS.md
          retention-days: 30
          if-no-files-found: error


      - name: Save server package in a private draft release when artifact quota is full
        if: steps.server-artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_label=${GITHUB_REF_NAME//\//-}
          release_tag="preview-${branch_label}-${GITHUB_SHA:0:12}"
          if ! gh release view "$release_tag" > /dev/null 2>&1; then
            gh release create "$release_tag" --draft --prerelease --target "$GITHUB_SHA" --title 'LiftControl 0.7 / Android 0.2.0 beta' --notes 'Тестовая сборка. Перед установкой сервера прочитайте UPDATE-v07.md. FCM требует отдельной настройки Firebase.' || gh release view "$release_tag"
          fi
          python - <<'PYCODE'
          import pathlib,zipfile
          files=[line.split('  ',1)[1].strip() for line in pathlib.Path('RELEASE.sha256').read_text().splitlines()]+['RELEASE.sha256','liftcontrol-api-v06-amd64.tar.gz.sha256']
          with zipfile.ZipFile('LiftControl-v0.7-amd64.zip','w',zipfile.ZIP_STORED) as archive:
              for filename in files: archive.write(filename)
          PYCODE
          gh release upload "$release_tag" LiftControl-v0.7-amd64.zip --clobber
