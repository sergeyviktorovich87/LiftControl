name: Duty mechanic repair and completion UI
on:
  push:
    branches: [main, codex/duty-field-actions]
    paths: ['web/**', '.github/workflows/duty-actions-ui.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/duty-actions-ui.yml']
permissions:
  contents: read
jobs:
  commissioning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Start local ticket UI
        run: |
          npm --prefix web run dev -- --host 127.0.0.1 --port 5173 > /tmp/duty-actions-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/duty-actions-vite.log
          exit 1
      - name: Check repair and completion rights, release confirmation, retries and mobile actions
        run: |
          export PUSH_CHROME="$(command -v google-chrome || command -v chromium)"
          node web/tool/check-duty-actions.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duty-actions-ui-diagnostics
          path: |
            /tmp/lift-duty-actions-*.png
            /tmp/duty-actions-vite.log
          if-no-files-found: ignore
