name: Settings responsive UI
on:
  push:
    branches: [main, codex/settings-layout]
    paths: ['web/**', '.github/workflows/settings-ui.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/settings-ui.yml']
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Start local settings UI
        run: |
          npm --prefix web run dev -- --host 127.0.0.1 --port 5173 > /tmp/settings-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/settings-vite.log
          exit 1
      - name: Check sections, forms, drafts, roles and narrow screens
        run: |
          export SETTINGS_CHROME_EXECUTABLE="$(command -v google-chrome || command -v chromium)"
          node web/tool/check-settings.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-ui-diagnostics
          path: |
            /tmp/liftcontrol-settings-*.png
            /tmp/settings-vite.log
          if-no-files-found: ignore
