name: Verify beta upgrade signature
on:
  push:
    paths: ['.github/workflows/verify-beta-signature.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Private draft release tag containing the Android ZIP
        required: true
        default: preview-feature-android-client-066ee75f096a
permissions:
  contents: write
jobs:
  signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || 'preview-feature-android-client-066ee75f096a' }}
      EXPECTED_BETA_CERT_SHA256: 1d3a932475b81c6aa369889e4663d618aabc22924bae9d0751b8a0618f98b118
    steps:
      - uses: actions/checkout@v4
      - name: Download the private beta package
        run: gh release download "$RELEASE_TAG" --pattern 'LiftControl-Android-0.2.0-beta-arm64.zip' --dir verify
      - name: Verify APK contents against build metadata
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          folder=pathlib.Path('verify')
          with zipfile.ZipFile(folder/'LiftControl-Android-0.2.0-beta-arm64.zip') as archive:
              name='LiftControl-Android-0.2.0-beta-arm64.apk'
              assert archive.getinfo(name).file_size < 200*1024*1024
              data=archive.read(name)
              metadata=json.loads(archive.read('android-release.json'))['android']
              assert len(data)==metadata['size']
              assert hashlib.sha256(data).hexdigest()==metadata['sha256']
              (folder/name).write_bytes(data)
              print('APK_METADATA_VERIFIED',json.dumps(metadata,ensure_ascii=False))
              print('APK_SOURCE_COMMIT',archive.read('SOURCE_COMMIT.txt').decode().strip())
          PY
      - name: Verify cryptographic signature and upgrade compatibility
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs verify/LiftControl-Android-0.2.0-beta-arm64.apk | tee verify/signature.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' verify/signature.txt)
          if [[ "$actual" != "$EXPECTED_BETA_CERT_SHA256" ]]; then
            echo 'BETA_UPGRADE_SIGNATURE_MISMATCH: do not claim this APK can update the previously supplied 0.1.0 beta.'
            exit 1
          fi
          echo 'EXISTING_BETA_UPDATE_SIGNATURE_MATCHES'
